<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SQLForge · SQL 格式化与方言转换</title>
  <meta name="description" content="在线格式化 SQL，并在 Hive、Spark、ClickHouse、MySQL、PostgreSQL 等 27 种方言之间转换；附带语法树、字段血缘和结构对比。基于 sqlglot。">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <script defer src="https://umami.dengshu.ovh/script.js" data-website-id="%VITE_UMAMI_WEBSITE_ID%" data-domains="sqlforge.dengshu.ovh"></script>
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 8h15M15 4l4 4-4 4"/><path d="M20 16H5M9 12l-4 4 4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17l9-10"/></symbol>
  </svg>

  <a class="q-skip" href="#editor-in">跳至 SQL 输入框</a>

  <div class="q-app q-app--wide">
    <header class="q-top">
      <a class="q-round" href="https://github.com/dengshu2/sqlforge" target="_blank" rel="noopener" aria-label="GitHub 上的源码"><svg class="q-i"><use href="#i-github"/></svg></a>
      <div class="q-status">
        <b class="brand"><span class="q-mark" aria-hidden="true">S</span>SQLForge</b>
        <span>SQL 格式化与方言转换</span>
      </div>
      <button class="q-pill" id="share" type="button"><svg class="q-i q-i--sm"><use href="#i-link"/></svg>分享</button>
    </header>

    <main class="q-page work">
      <div class="toolbar">
        <div class="route" role="group" aria-label="方言">
          <button class="pick" id="pick-from" type="button" aria-expanded="false" aria-controls="picker">
            <small>从</small><b id="from-label">Hive</b><svg class="q-i q-i--sm chev"><use href="#i-down"/></svg>
          </button>
          <button class="q-play q-play--sm swap" id="swap" type="button" aria-label="交换源方言和目标方言"><svg class="q-i"><use href="#i-swap"/></svg></button>
          <button class="pick" id="pick-to" type="button" aria-expanded="false" aria-controls="picker">
            <small>转成</small><b id="to-label">PostgreSQL</b><svg class="q-i q-i--sm chev"><use href="#i-down"/></svg>
          </button>
        </div>
        <div class="q-actions">
          <button class="q-btn" id="format" type="button"><span class="q-spinner" aria-hidden="true"></span>格式化</button>
          <button class="q-btn q-btn--primary" id="transpile" type="button"><span class="q-spinner" aria-hidden="true"></span>转换</button>
        </div>
      </div>

      <section class="picker q-rise" id="picker" aria-labelledby="picker-title" hidden>
        <div class="picker-head">
          <h3 id="picker-title">源方言</h3>
          <input class="q-search" id="picker-search" type="search" placeholder="搜索方言" aria-label="搜索方言" autocomplete="off" spellcheck="false">
          <button class="q-btn q-btn--quiet q-btn--sm" id="picker-close" type="button">收起</button>
        </div>
        <div id="picker-list"></div>
      </section>

      <div class="panes">
        <section class="pane pane--in" id="pane-in" aria-labelledby="in-title">
          <div class="pane-head">
            <h2 class="pane-title" id="in-title">输入 · <span id="in-dialect">Hive</span></h2>
            <span class="q-count" id="in-count"></span>
            <button class="q-btn q-btn--quiet q-btn--sm" id="clear" type="button">清空</button>
          </div>
          <div class="code" id="editor-in"></div>
          <p class="q-notice q-notice--danger in-error" id="in-error" role="alert" hidden></p>
          <span class="q-typing waiting" aria-hidden="true"><i></i><i></i><i></i></span>
        </section>

        <section class="pane pane--out" id="pane-out" aria-labelledby="out-title" aria-live="polite">
          <div class="pane-head">
            <h2 class="pane-title" id="out-title">结果 · <span id="out-dialect">PostgreSQL</span><span class="stale" id="out-stale" hidden> · 输入已改动</span></h2>
            <button class="q-play q-play--sm" id="copy" type="button" aria-label="复制结果" hidden><svg class="q-i"><use href="#i-copy"/></svg></button>
          </div>
          <div class="code" id="editor-out"></div>
          <div class="notes" id="out-notes" hidden></div>
          <span class="q-typing waiting" aria-hidden="true"><i></i><i></i><i></i></span>
        </section>
      </div>
      <p class="keys" id="keys"></p>

      <section class="q-sec analysis" aria-labelledby="an-title">
        <div class="an-head">
          <h3 id="an-title">分析</h3>
          <div class="q-seg" role="tablist" aria-label="分析">
            <button type="button" role="tab" id="tab-ast" data-tab="ast" aria-selected="true" aria-controls="an-body">语法树</button>
            <button type="button" role="tab" id="tab-lineage" data-tab="lineage" aria-selected="false" aria-controls="an-body">字段血缘</button>
            <button type="button" role="tab" id="tab-diff" data-tab="diff" aria-selected="false" aria-controls="an-body">改动</button>
          </div>
          <span class="q-meta an-meta" id="an-meta"></span>
        </div>
        <div class="an-body" id="an-body" role="tabpanel" aria-labelledby="tab-ast">
          <div id="an-content"></div>
          <span class="q-typing waiting" aria-hidden="true"><i></i><i></i><i></i></span>
        </div>
      </section>

      <footer class="foot">
        基于 <a href="https://github.com/tobymao/sqlglot" target="_blank" rel="noopener">sqlglot</a> · 27 种方言 · <a href="/api/docs" target="_blank" rel="noopener">API 文档</a>
      </footer>
    </main>
  </div>

  <div class="q-toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
