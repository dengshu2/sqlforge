services:
  sqlforge:
    build:
      context: .
      args:
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
    container_name: sqlforge
    restart: unless-stopped
    ports:
      - "127.0.0.1:7082:8080"
    environment:
      - TZ=Asia/Shanghai
      # Caddy sets X-Real-IP to the visitor's address; the rate limit keys on it.
      - CLIENT_IP_HEADER=X-Real-IP
      - ANALYTICS_ORIGINS=https://umami.dengshu.ovh https://static.cloudflareinsights.com https://cloudflareinsights.com
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  proxy-network:
    external: true
