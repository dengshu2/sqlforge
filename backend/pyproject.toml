[project]
name = "sqlforge"
version = "0.2.0"
description = "SQL formatting, dialect transpilation and analysis API powered by sqlglot"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "sqlglot>=30.21.0",
    "uvicorn[standard]>=0.42.0",
]

[project.scripts]
sqlforge = "sqlforge.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlforge"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.0.2",
]

